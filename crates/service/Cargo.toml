[package]
name = "gittor-service"
version = "0.1.1"
edition.workspace = true
license.workspace = true
description = "App state and commands for Gittor, shared by the Tauri app and the dev server"

[dependencies]
gittor-graph = { path = "../graph" }
gittor-git = { path = "../git" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
ignore = "0.4"
sha2 = "0.10"
flate2 = "1"
mmdflux = { version = "2.6", default-features = false }
ts-rs = "12"
