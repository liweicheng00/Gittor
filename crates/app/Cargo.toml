[package]
name = "gittor"
version = "0.1.3"
edition.workspace = true
license.workspace = true
description = "Gittor: a light, read-only git graph and compare tool"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
gittor-service = { path = "../service" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
# Without the default "zip" feature: the zip crate is only for updates on Windows, and macOS updates use
# tar.gz.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
serde_json = "1"

[features]
# Serves the embedded UI. `tauri dev` turns it off to load the Vite dev server.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
