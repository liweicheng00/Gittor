<style>
  /* Layout: a sticky index of the scripts at the left, and one sheet for each script at the right.

  :root {

    :root:not([data-theme="light"]) {
      --bg: #13141b; --panel: #1b1d27; --line: #2e3140; --fg: #e8e9f1; --muted: #9a9eb2;
      --accent: #a99cff; --accent-soft: #2a2748; --done: #6fd6b6; --done-soft: #17352e;
      --idea: #f0c26b; --idea-soft: #3a2e14; --code: #232532; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #13141b; --panel: #1b1d27; --line: #2e3140; --fg: #e8e9f1; --muted: #9a9eb2;
    --accent: #a99cff; --accent-soft: #2a2748; --done: #6fd6b6; --done-soft: #17352e;
    --idea: #f0c26b; --idea-soft: #3a2e14; --code: #232532; color-scheme: dark;
  }
  body { background: var(--bg); color: var(--fg); font: 400 15px/1.65 var(--text); }
  .wrap { max-width: 1120px; margin: 0 auto; padding-block: 36px 72px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  header.top { display: flex; flex-direction: column; gap: 6px; margin-bottom: 28px; }
  h1 { font: 700 28px/1.2 var(--text); margin: 0; letter-spacing: -0.01em; }
  .lede { color: var(--muted); margin: 0; max-width: 64ch; }

  nav.index h2 { font: 600 12px/1 var(--text); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
  nav.index ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  nav.index a { display: flex; gap: 8px; padding: 5px 8px; border-radius: 6px; color: var(--fg); text-decoration: none; }
  nav.index a:hover { background: var(--accent-soft); }
  nav.index a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  nav.index .n { font: 500 12px/1.9 var(--mono); color: var(--muted); flex: none; width: 22px; }
  main { display: flex; flex-direction: column; gap: 40px; min-width: 0; }
  section.group { display: flex; flex-direction: column; gap: 18px; }
  section.group > h2 { font: 700 20px/1.3 var(--text); margin: 0; }
  section.group > p { margin: 0; color: var(--muted); max-width: 70ch; }
  article.sheet { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 22px 24px; display: flex; flex-direction: column; gap: 16px; scroll-margin-top: 16px; }
  .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 12px; }
  .head .n { font: 500 13px/1 var(--mono); color: var(--muted); }
  .head h3 { font: 700 19px/1.3 var(--text); margin: 0; }
  .chip { font: 600 12px/1 var(--text); padding: 5px 9px; border-radius: 999px; white-space: nowrap; }
  .chip.done { color: var(--done); background: var(--done-soft); }
  .chip.idea { color: var(--idea); background: var(--idea-soft); }
  .chip.first { color: var(--accent); background: var(--accent-soft); }
  .hook { font: 600 17px/1.4 var(--text); margin: 0; }
  .hook small { display: block; font: 400 13px/1.5 var(--text); color: var(--muted); margin-top: 2px; }
  dl.facts { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; font-size: 14px; }
  dl.facts dt { color: var(--muted); }
  dl.facts dd { margin: 0; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th { text-align: left; font: 600 12px/1.3 var(--text); letter-spacing: 0.04em; color: var(--muted); padding: 0 12px 8px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { vertical-align: top; padding: 9px 12px 9px 0; border-bottom: 1px solid var(--line); }
  tr:last-child td { border-bottom: 0; }
  td.i { font: 500 12px/1.9 var(--mono); color: var(--muted); width: 20px; }
  td.cap { font-weight: 600; min-width: 170px; }
  td.cam { color: var(--muted); min-width: 120px; }
  pre { margin: 0; background: var(--code); border-radius: 8px; padding: 12px 14px; font: 400 13px/1.6 var(--mono); overflow-x: auto; white-space: pre; }
  .label { font: 600 12px/1 var(--text); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
  ul.plain { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; }
  .note { margin: 0; color: var(--muted); font-size: 14px; }
  .rules { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px 24px; }
  @media (max-width: 800px) {
    .cols { grid-template-columns: minmax(0, 1fr); }
    nav.index { position: static; max-height: none; }
    article.sheet { padding: 18px 16px; }
    h1 { font-size: 24px; }
  }
</style>

            id: "t-cleanup", n: 12, title: "I have 40 old branches", status: "idea",
            concept: "已經合併進 main 的分支，內容都在 main 裡了，可以安全刪除。",
            steps: ["開場：側欄一長串分支。", "Delete Merged Branches，預覽列出可以刪的分支。", "保留其中幾個，刪除其餘的。", "按 Undo 可以全部救回來。"],
            git: "git branch --merged main | grep -v main | xargs git branch -d",
          },
        ],
      },
    ],
    open: {
      title: "待決定",
      items: [
        "教學系列的結構（情境 → 看懂 → 修正 → 對照指令）是否就是要的方向。",
        "第一批做哪幾支。目前建議標了「第一批」的五支。",
        "教學片的長度放寬到 30 到 45 秒是否可以。",
        "教學系列沿用目前的版面與 Plasma 主題，還是要有自己的樣子。",
        "結尾標語 The git client for reviewing your agents 只和第 2、3 支直接相關，其他幾支要不要換。",
        "音樂（慢、低、結尾無特效音）是否已經到位。",
      ],
    },
  };

  const el = (tag, props = {}, ...kids) => {
    const node = Object.assign(document.createElement(tag), props);
    node.append(...kids.filter((k) => k !== null && k !== undefined));
    return node;
  };
  const STATUS = { done: ["done", "已錄製"], idea: ["idea", "提案"] };
  const list = (title, items) => el("div", {}, el("p", { className: "label" }, title), el("ul", { className: "plain" }, ...items.map((t) => el("li", {}, t))));

  function sheet(s, prefix) {
    const [cls, text] = STATUS[s.status];
    const head = el("div", { className: "head" },
      el("span", { className: "n" }, `${prefix}${s.n}`),
      el("h3", {}, s.title),
      el("span", { className: `chip ${cls}` }, text),
      s.first ? el("span", { className: "chip first" }, "第一批") : null,
    );
    const parts = [head];
    if (s.hook) parts.push(el("p", { className: "hook" }, s.hook, el("small", {}, "開場字幕")));
    const facts = [];
    if (s.length) facts.push(el("dt", {}, "長度"), el("dd", {}, s.length));
    if (s.setup) facts.push(el("dt", {}, "開場狀態"), el("dd", {}, s.setup));
    if (s.concept) facts.push(el("dt", {}, "教的觀念"), el("dd", {}, s.concept));
    if (facts.length) parts.push(el("dl", { className: "facts" }, ...facts));
    if (s.beats) {
      const rows = s.beats.map(([cap, action, cam], i) => el("tr", {},
        el("td", { className: "i" }, String(i + 1)), el("td", { className: "cap" }, cap), el("td", {}, action), el("td", { className: "cam" }, cam)));
      parts.push(el("div", { className: "scroll" }, el("table", {},
        el("thead", {}, el("tr", {}, el("th", {}, ""), el("th", {}, "字幕"), el("th", {}, "畫面動作"), el("th", {}, "鏡頭"))),
        el("tbody", {}, ...rows))));
    }
    if (s.steps) parts.push(el("div", {}, el("p", { className: "label" }, "步驟"), el("ol", { className: "plain" }, ...s.steps.map((t) => el("li", {}, t)))));
    if (s.git) parts.push(el("div", {}, el("p", { className: "label" }, "對照的 git 指令"), el("pre", {}, s.git)));
    if (s.notes) parts.push(...s.notes.map((t) => el("p", { className: "note" }, `備註：${t}`)));
    return el("article", { className: "sheet", id: s.id }, ...parts);
  }

  document.getElementById("updated").textContent = `最後更新 ${DOC.updated}`;
  const main = document.getElementById("main");
  const index = document.getElementById("index");
  main.append(el("section", { className: "rules", id: "rules" }, list(DOC.rules.title, DOC.rules.items)));
  index.append(el("div", {}, el("ol", {}, el("li", {}, el("a", { href: "#rules" }, el("span", { className: "n" }, "·"), DOC.rules.title)), el("li", {}, el("a", { href: "#open" }, el("span", { className: "n" }, "·"), DOC.open.title)))));
  for (const g of DOC.groups) {
    const prefix = g.id === "tutorials" ? "T" : "";
    main.append(el("section", { className: "group", id: g.id }, el("h2", {}, g.title), el("p", {}, g.intro), ...g.scripts.map((s) => sheet(s, prefix))));
    index.append(el("div", {}, el("h2", {}, g.title), el("ol", {}, ...g.scripts.map((s) => el("li", {}, el("a", { href: `#${s.id}` }, el("span", { className: "n" }, `${prefix}${s.n}`), s.title))))));
  }
  main.append(el("section", { className: "rules", id: "open" }, list(DOC.open.title, DOC.open.items)));
</script>
