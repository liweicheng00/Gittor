# Tests each push to main and each pull request: the Rust tests, clippy, the types of the UI, the unit
# tests of the UI, and all UI scenarios in Chromium. Four machines run the scenarios in parallel, each
# one part (GITTOR_E2E_SHARD); ui/e2e/durations.txt makes the parts about equal in time.
#
# The security checks run before a release, not here: see .github/workflows/security.yml.
#
# Each action is pinned to the commit of a release: a tag can move, a commit cannot. Dependabot
# (.github/dependabot.yml) proposes new commits.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install WebKitGTK for the Tauri app
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Git user for the tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - run: npm --prefix ui ci
      # tauri::generate_context!() needs ui/dist.
      - run: npm --prefix ui run build
      - run: cargo test -q --locked
      - name: The types of the UI are current
        run: git diff --exit-code ui/src/bindings
      - run: cargo clippy -q --all-targets --locked
      - run: npx tsc --noEmit -p .
        working-directory: ui
      - run: npm test
        working-directory: ui

  e2e:
    name: e2e (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      GITTOR_E2E_SHARD: ${{ matrix.shard }}/4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Git user for the scenarios
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - run: npm --prefix ui ci
      # The browser of Playwright is about 170 MB. The cache keeps the download out of each run; the
      # key is the lock file, because the version of Playwright comes from there. The install step
      # still runs: it puts the system libraries of the browser in place, which the cache does not hold.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        working-directory: ui
      # The scenarios measure text, for example the left tabs. Inter is the font of the machines that
      # made the scenarios; the default font of the runner is wider. The UI asks for system-ui, so
      # fontconfig must map system-ui to Inter.
      - name: Install the Inter font for system-ui
        run: |
          sudo apt-get install -y fonts-inter
          sudo tee /etc/fonts/conf.d/56-prefer-inter.conf > /dev/null <<'XML'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
          <fontconfig>
            <alias><family>system-ui</family><prefer><family>Inter</family></prefer></alias>
            <alias><family>sans-serif</family><prefer><family>Inter</family></prefer></alias>
          </fontconfig>
          XML
          fc-cache -f
          fc-match system-ui
      - run: npm --prefix ui run build
      - run: cargo build -q --locked -p gittor-devserver
      - name: Run all scenarios
        run: |
          GITTOR_CONFIG_DIR="$RUNNER_TEMP/config" target/debug/gittor-devserver ui/dist 5174 &
          sleep 2
          set +e
          ui/e2e/run-all.sh "$RUNNER_TEMP/e2e" | tee "$RUNNER_TEMP/run.log"
          status=${PIPESTATUS[0]}
          # Some scenarios are flaky under load (see AGENTS.md): the failed ones run once more alone.
          if [ "$status" -ne 0 ]; then
            failed=$(sed -n 's/^FAILED: //p' "$RUNNER_TEMP/run.log")
            echo "Run these scenarios again: $failed"
            GITTOR_E2E_SHARD= GITTOR_E2E_ONLY="^($(echo "$failed" | tr ' ' '|'))\$" ui/e2e/run-all.sh "$RUNNER_TEMP/e2e-again"
            status=$?
          fi
          exit "$status"
      - name: Keep the logs and the screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/e2e/*.log
            ${{ runner.temp }}/e2e/shots
            ${{ runner.temp }}/e2e-again/*.log
            ${{ runner.temp }}/e2e-again/shots
          if-no-files-found: ignore
