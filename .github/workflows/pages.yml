# Publishes the download page on GitHub Pages: https://liweicheng00.github.io/Gittor/
# The page is the folder site/ only (with the intro video), plus the icon of the app. Pages does not publish
# docs/, because it has internal documents.
# The download button links to releases/latest/download/Gittor.dmg, so a new release needs no change here.
# Turn Pages on once: gh api -X POST repos/liweicheng00/Gittor/pages -f build_type=workflow
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "crates/app/icons/icon.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Put the page together
        run: |
          mkdir _site
          cp -R site/. _site/
          cp crates/app/icons/icon.png _site/icon.png

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
