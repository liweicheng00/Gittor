# Publishes the download page on GitHub Pages: https://liweicheng00.github.io/Gittor/
# The page is the folder site/ only (with the intro video), plus the icon of the app. Pages does not publish
# docs/, because it has internal documents.
# The download button links to releases/latest/download/Gittor.dmg, so a new release needs no change here.
# Turn Pages on once: gh api -X POST repos/liweicheng00/Gittor/pages -f build_type=workflow
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "crates/app/icons/icon.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Put the page together
        run: |
          mkdir _site
          cp -R site/. _site/
          cp crates/app/icons/icon.png _site/icon.png

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
