# Builds, signs and publishes a release when a tag v<version> arrives (scripts/release.sh pushes it).
# The release has the disk image for new users (with the version in its name, and again as Gittor.dmg), and
# Gittor.app.tar.gz, its .sig and latest.json for the updater of the app. The release is public at once: the
# apps that run see it at their next check.
#
# The workflow builds from nothing: no cache, so no file of an earlier run can get into a release. Each
# action is pinned to the commit of a release, and npm and cargo use the lock files only.
name: Release

on:
  push:
    tags: ["v*"]

# contents: the release. id-token and attestations: the provenance of the files.
permissions:
  contents: write
  id-token: write
  attestations: write

concurrency: release

jobs:
  macos:
    runs-on: macos-latest
    # With a required reviewer on this environment (Settings › Environments), the job waits for an
    # approval before it gets the secrets.
    environment: release
    env:
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check the settings and the version
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          missing=()
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID TAURI_SIGNING_PRIVATE_KEY TAURI_UPDATER_PUBKEY; do
            [ -n "${!v:-}" ] || missing+=("$v")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Set these in Settings > Secrets and variables > Actions: ${missing[*]}"
            exit 1
          fi
          version=$(node -p 'require("./crates/app/tauri.conf.json").version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag $GITHUB_REF_NAME is not the version v$version of tauri.conf.json. Use scripts/release.sh."
            exit 1
          fi
          # The release notes, before the long build.
          node scripts/release-notes.mjs check "docs/releases/$GITHUB_REF_NAME.md"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin


      # codesign and build-dmg.sh find the Developer ID certificate in this keychain.
      - name: Import the signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/build.keychain-db"
          password=$(openssl rand -hex 16)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"

      - name: Build, sign and notarize
        run: scripts/build-dmg.sh --universal --updater

      # A record, signed by GitHub, that this workflow made these files from this commit. Check a file with:
      # gh attestation verify <file> --repo liweicheng00/Gittor
      - name: Attest the provenance of the files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/universal-apple-darwin/release/bundle/macos/Gittor.app.tar.gz

      - name: Write the release notes
        # The notes come from docs/releases/<tag>.md, not from the commit messages. Without the file, the
        # release stops here.
        run: |
          node scripts/release-notes.mjs github "docs/releases/$GITHUB_REF_NAME.md" > notes.md
          node scripts/release-notes.mjs update "docs/releases/$GITHUB_REF_NAME.md" > update-notes.md
          cat notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir=target/universal-apple-darwin/release/bundle
          version=${GITHUB_REF_NAME#v}
          cp "$dir/macos/Gittor.app.tar.gz" Gittor.app.tar.gz
          cp "$dir/macos/Gittor.app.tar.gz.sig" Gittor.app.tar.gz.sig
          dmg=$(ls "$dir"/dmg/*.dmg | head -n 1)
          # Gittor.dmg has the same name in each release, so the download page links to
          # releases/latest/download/Gittor.dmg. The copy has the same digest, so the attestation covers it.
          cp "$dmg" Gittor.dmg
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/Gittor.app.tar.gz"
          scripts/latest-json.sh "$version" "$url" Gittor.app.tar.gz.sig update-notes.md > latest.json
          gh release create "$GITHUB_REF_NAME" --title "Gittor $version" --notes-file notes.md \
            "$dmg" Gittor.dmg Gittor.app.tar.gz Gittor.app.tar.gz.sig latest.json
